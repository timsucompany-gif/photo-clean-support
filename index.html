    --bg:#0B0D0C;
    --card:#141815;
    --line:#242C27;

  a{
    -webkit-tap-highlight-color:transparent

  .page{
    width:min(100%,440px);
    margin:0 auto;
    padding:18px 20px calc(36px + env(safe-area-inset-bottom));

  /* ---------- 語言 ---------- */

  .topbar{
    display:flex;
    justify-content:flex-end;
    min-height:38px;
    margin-bottom:18px;
  }

  .lang{
    position:relative
  }

  .lang-btn{
    display:flex;
    align-items:center;
    gap:7px;

    height:36px;
    padding:0 12px;

    border:1px solid var(--line);
    border-radius:11px;

    background:rgba(255,255,255,.04);
    color:var(--text);

    font:600 13px/1 inherit;
    cursor:pointer;

    transition:
      border-color .18s,
      background .18s;
  }

  .lang-btn:hover{
    border-color:#37423b;
    background:rgba(255,255,255,.07)
  }

  .caret{
    width:6px;
    height:6px;

    border-right:1.6px solid currentColor;
    border-bottom:1.6px solid currentColor;

    transform:
      rotate(45deg)
      translateY(-2px);

    opacity:.55;

    transition:transform .18s;
  }

  .lang.open .caret{
    transform:
      rotate(225deg)
      translate(-1px,-1px)
  }

  .lang-menu{
    position:absolute;
    z-index:10;

    top:calc(100% + 8px);
    right:0;

    width:150px;
    padding:5px;

    background:var(--card);

    border:1px solid var(--line);
    border-radius:12px;

    box-shadow:
      0 16px 40px rgba(0,0,0,.55);

    opacity:0;
    visibility:hidden;

    transform:translateY(-6px);

    transition:
      opacity .16s,
      transform .16s,
      visibility .16s;
  }

  .lang.open .lang-menu{
    opacity:1;
    visibility:visible;
    transform:translateY(0)
  }

  .lang-opt{
    display:block;

    width:100%;

    padding:9px 11px;

    border:0;
    border-radius:8px;

    background:transparent;
    color:var(--text);

    font:14px/1.2 inherit;
    text-align:left;

    cursor:pointer;
  }

  .lang-opt:hover{
    background:rgba(255,255,255,.06)
  }

  .lang-opt[aria-selected="true"]{
    color:var(--accent);
    font-weight:700;
    background:rgba(74,222,106,.10)
  }

  /* ---------- Hero ---------- */

  .hero{

  }

    直接使用你放在網站資料夾裡的 app-icon.png

  /* ---------- 商店按鈕 ---------- */

    font-size:11px;
    font-weight:700;

    letter-spacing:.14em;

  .stores{

  .store{

  .store:active{

  .store svg{
    width:26px;

  }

  .store-txt{

    line-height:1.15;

  }

  .store-small{

  .store-large{

  .store-caret{

  /* ---------- 減少動畫 ---------- */

  @media (prefers-reduced-motion:reduce){

    *{
      transition:none !important;
      animation:none !important
    }

  }
</style>

<script>

/* =========================================================
   多語言
========================================================= */

const L = {

  'zh-Hant': {

    label:'繁體中文',
    htmlLang:'zh-Hant',

    title:'AI Clean：照片整理大師',

    appName:'：照片整理大師',

    altName:'Photo Clean Master',

    inapp:
      '若按了沒有跳轉，請點右上角「⋯」選擇「在瀏覽器中開啟」。'

  },


  'zh-Hans': {

    label:'简体中文',
    htmlLang:'zh-Hans',

    title:'AI Clean：相册整理大师',

    appName:'：相册整理大师',

    altName:'Photo Clean Master',

    tagline:
      '轻松整理照片和视频，让相册保持清爽整洁。',

    dlTitle:

    helpTitle:
      '需要帮助？',

    helpBody:

    contactLabel:

    inapp:

  },


  'en': {

    htmlLang:'en',

    title:
      'AI Clean: Photo Cleaner Master',

    appName:
      ': Photo Cleaner Master',

    altName:
      '照片整理大師',

    contactLabel:

  },


  'ja': {

    htmlLang:'ja',

    title:
      'AI Clean：写真整理マスター',

    appName:
      '：写真整理マスター',

    altName:
      'Photo Clean Master',

    tagline:
      '写真や動画をかんたんに整理して、ライブラリをすっきり保ちます。',

    dlTitle:
      'ダウンロード',

    helpTitle:
      'サポートが必要ですか？',

    helpBody:
      'AI Clean：写真整理マスターのご利用中に問題が発生した場合や、ご意見・ご要望がございましたら、メールでお気軽にお問い合わせください。',

    contactLabel:
      'お問い合わせ',

    inapp:
      '反応しない場合は、右上の「⋯」から「ブラウザで開く」を選んでください。'

  },


  'ko': {

    label:'한국어',
    htmlLang:'ko',

    title:
      'AI Clean: 사진 정리 마스터',

    appName:
      ': 사진 정리 마스터',

    altName:
      'Photo Clean Master',

    tagline:
      '사진과 동영상을 간편하게 정리하고 보관함을 깔끔하게 유지하세요.',

    dlTitle:

    helpTitle:

    helpBody:
      'AI Clean: 사진 정리 마스터를 사용하면서 문제가 발생했거나 의견이 있다면 이메일로 언제든지 문의해 주세요.',

    contactLabel:
      '문의',

    inapp:
      '눌러도 반응이 없으면 오른쪽 위 “⋯”에서 “브라우저로 열기”를 선택하세요.'

  },


  'es': {

    label:'Español',
    htmlLang:'es',

    title:
      'AI Clean: Limpiador de Fotos',

    appName:
      ': Limpiador de Fotos',

    altName:
      '照片整理大師',

    tagline:
      'Una forma sencilla de ordenar tus fotos y vídeos y mantener la galería limpia.',

    dlTitle:
      'Descargar',

    helpTitle:
      '¿Necesitas ayuda?',

    helpBody:
      'Si tienes algún problema con AI Clean: Limpiador de Fotos, o quieres enviarnos tus comentarios, escríbenos por correo.',

    contactLabel:
      'Contacto',

    inapp:
      'Si no ocurre nada, toca «⋯» arriba a la derecha y elige «Abrir en el navegador».'

  }

};


const ORDER = [
  'zh-Hant',
  'zh-Hans',
  'en',
  'ja',
  'ko',
  'es'
];


/* =========================================================
   Android / IG / FB / LINE
========================================================= */

const PKG =
  'com.timsucompany.photocleanermaster';

const PLAY_WEB =
  'https://play.google.com/store/apps/details?id='
  + PKG;


/*
  Android：

  在 Instagram / Facebook / LINE
  等內建瀏覽器裡，直接使用
  play.google.com 有機會無法交給
  Google Play App。

  所以 Android 改用 intent://

  如果無法開啟 Play App，
  browser_fallback_url 會回到正常網頁。
*/

if (/Android/i.test(navigator.userAgent)) {

  document.getElementById(
    'androidLink'
  ).href =
    'intent://details?id='
    + PKG
    + '#Intent;scheme=market;package=com.android.vending;'
    + 'S.browser_fallback_url='
    + encodeURIComponent(PLAY_WEB)
    + ';end';

}


/* =========================================================
   偵測 IG / FB / LINE 等內建瀏覽器
========================================================= */

if (
  /Instagram|FBAN|FBAV|Line\/|Twitter|MicroMessenger/i
  .test(navigator.userAgent)
) {

  document.body.classList.add(
    'in-app'
  );

}


/* =========================================================
   語言選單
========================================================= */

const langEl =
  document.getElementById('lang');

const langBtn =
  document.getElementById('langBtn');

const langMenu =
  document.getElementById('langMenu');


ORDER.forEach(code => {

  const b =
    document.createElement('button');

  b.className =
    'lang-opt';

  b.type =
    'button';

  b.setAttribute(
    'role',
    'option'
  );

  b.dataset.code =
    code;

  b.textContent =
    L[code].label;

  b.addEventListener(
    'click',
    () => {

      apply(code);
      close();

    }
  );

  langMenu.appendChild(b);

});


function close(){

  langEl.classList.remove(
    'open'
  );

  langBtn.setAttribute(
    'aria-expanded',
    'false'
  );

}


langBtn.addEventListener(
  'click',
  () => {

    const open =
      langEl.classList.toggle(
        'open'
      );

    langBtn.setAttribute(
      'aria-expanded',
      open
    );

  }
);


document.addEventListener(
  'click',
  e => {

    if (
      !langEl.contains(e.target)
    ) {

      close();

    }

  }
);


document.addEventListener(
  'keydown',
  e => {

    if (
      e.key === 'Escape'
    ) {

      close();

    }

  }
);


/* =========================================================
   套用語言
========================================================= */

function apply(code){

  const t =
    L[code] ||
    L['zh-Hant'];


  document.documentElement.lang =
    t.htmlLang;


  document.title =
    t.title;


  document.getElementById(
    'langLabel'
  ).textContent =
    t.label;


  document.getElementById(
    'appName'
  ).textContent =
    t.appName;


  document.getElementById(
    'altName'
  ).textContent =
    t.altName;


  document.getElementById(
    'tagline'
  ).textContent =
    t.tagline;


  document.getElementById(
    'dlTitle'
  ).textContent =
    t.dlTitle;


  document.getElementById(
    'helpTitle'
  ).textContent =
    t.helpTitle;


  document.getElementById(
    'helpBody'
  ).textContent =
    t.helpBody;


  document.getElementById(
    'contactLabel'
  ).textContent =
    t.contactLabel;


  document.getElementById(
    'inappNote'
  ).textContent =
    t.inapp;


  langMenu
    .querySelectorAll('.lang-opt')
    .forEach(o => {

      o.setAttribute(
        'aria-selected',
        o.dataset.code === code
      );

    });


  try {

    localStorage.setItem(
      'lang',
      code
    );

  } catch(e){}

}


/* =========================================================
   自動偵測語言
========================================================= */

function detect(){

  const tags =
    navigator.languages &&
    navigator.languages.length
      ? navigator.languages
      : [
          navigator.language ||
          'en'
        ];


  for (
    const raw of tags
  ){

    const tag =
      raw.toLowerCase();


    if (
      tag.startsWith('zh')
    ){

      if (
        /(^|-)(cn|hans|sg|my)(-|$)/
        .test(tag)
      ){

        return 'zh-Hans';

      }

      return 'zh-Hant';

    }


    if (
      tag.startsWith('ja')
    ){

      return 'ja';

    }


    if (
      tag.startsWith('ko')
    ){

      return 'ko';

    }


    if (
      tag.startsWith('es')
    ){

      return 'es';

    }


    if (
      tag.startsWith('en')
    ){

      return 'en';

    }

  }


  return 'en';

}


/* =========================================================
   初始化
========================================================= */

let saved =
  null;

try {

  saved =
    localStorage.getItem(
      'lang'
    );

} catch(e){}


apply(
  L[saved]
    ? saved
    : detect()
);

</script>
